name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          TARGET="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$TARGET" origin/main

          {
            echo "tag=$TAG"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --silent

      - name: Publish immutable action release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --json isDraft,isImmutable,isPrerelease >/dev/null 2>&1; then
            actual_target="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
            if [ -z "$actual_target" ]; then
              actual_target="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
            fi
            [ "$actual_target" = "$TARGET" ]

            state="$(
              gh release view "$TAG" \
                --json isDraft,isImmutable,isPrerelease \
                --jq '[.isDraft, .isImmutable, .isPrerelease] | @tsv'
            )"
            [ "$state" = $'false\ttrue\tfalse' ]
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes "release-actions $TAG" \
            --latest=false

          state="$(
            gh release view "$TAG" \
              --json isDraft,isImmutable,isPrerelease \
              --jq '[.isDraft, .isImmutable, .isPrerelease] | @tsv'
          )"
          [ "$state" = $'false\ttrue\tfalse' ]
