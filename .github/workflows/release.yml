name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          TARGET="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$TARGET" origin/main

          {
            echo "tag=$TAG"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tagged release action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.target }}
          path: release-action
          persist-credentials: false

      - name: Publish immutable action release
        id: publish
        uses: ./release-action
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"

      - name: Summary
        run: |
          {
            echo "### actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
